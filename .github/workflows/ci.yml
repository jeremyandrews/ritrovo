# CI for Ritrovo.
#
# Three things are gated here, and they are the three ways this repository can
# break without anyone noticing:
#
#   build    the five plugins still compile to wasm32-wasip1 against the pinned
#            SDK revision, with no Trovato checkout and no credentials. That
#            "standalone from public sources" claim is the whole premise, so it
#            is checked on every push rather than trusted.
#   demo     the one-command demo's wiring still matches the repository it
#            demonstrates, and the tutorial templates vendored for it still match
#            the Trovato release the demo runs. Both are shell and YAML, which
#            nothing else would catch.
#   lint     fmt, clippy with warnings as errors, and shellcheck over the scripts.
#
# The toolchain pin is duplicated here because dtolnay/rust-toolchain does not
# read rust-toolchain.toml. Bump both together.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (host target, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (wasm32-wasip1)
        run: cargo clippy --workspace --target wasm32-wasip1 --release -- -D warnings

      # The release build the overlay is assembled from. This is the step that
      # proves the SDK git dependency resolves for anyone, not just for a machine
      # that happens to have a Trovato checkout next door.
      - name: Build the plugins for WebAssembly
        run: cargo build --target wasm32-wasip1 --release

      - name: Assemble the overlay
        run: scripts/assemble-overlay.sh

      - name: Tests
        run: cargo test --workspace

  demo:
    name: demo wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nine files in docs/tutorial/templates are copies of Trovato's, vendored
      # so the demo needs nothing but Docker. This is what keeps the copy honest.
      - name: Vendored tutorial templates match the release
        run: scripts/check-tutorial-templates.sh

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Compose file parses
        run: docker compose -f docker-compose.demo.yml config >/dev/null
