[workspace]
resolver = "2"
members = [
    "demo/checks",
    "plugins/ritrovo_access",
    "plugins/ritrovo_cfp",
    "plugins/ritrovo_forms",
    "plugins/ritrovo_importer",
    "plugins/ritrovo_notify",
    "plugins/ritrovo_translate",
]

[workspace.package]
version = "0.2.1-devel"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
# trovato-sdk — the Trovato plugin contract, consumed as an EXTERNAL git
# dependency from the PUBLIC Trovato repository. Ritrovo builds with no Trovato
# checkout anywhere on disk, and with no credentials: anyone can clone this
# repository and run the build. Do not reintroduce a path dependency; a path dep
# is what made this workspace unbuildable outside the monorepo it was split from.
#
# This used to point at an unpublished development repository, which meant the
# build worked only for someone who already had access to a private repo — the
# opposite of what a public reference application is for. That repository is
# archived and is not the repo of record; nothing here may reference it.
#
# PINNED BY `rev` rather than a branch, so "Ritrovo builds against the published
# contract" names a specific contract rather than whatever `main` is today. And
# pinned to a RELEASE TAG's commit rather than to any commit on that line,
# because the tag's tree is the one the published kernel image was built from:
# the SDK the plugins compile against and the kernel they run on are then the
# same code. (netgrasp-trovato pins a version sweep commit on the same line
# instead, which is a different tradeoff for a different consumer.)
#
# BUMP PROTOCOL: two steps, neither of them a hand edit here.
#
#     scripts/sync-kernel-release.sh --set-version X.Y.Z
#
# resolves the tag against the public repository and writes the new release into
# kernel-release.toml and into every place this repository repeats it, the two
# revs and the recorded pin below included. Then review the diff.
#
# kernel-release:begin pin
#   tag                 v0.103.0
#   rev                 496b8f113be66102830723c1e2a968cad2ec1e0d
#   Trovato version     0.103.0
#   KERNEL_API_VERSION  (0, 103)
#
# The rev is the commit the v0.103.0 tag points at: the tree the
# ghcr.io/jeremyandrews/trovato:0.103.0 image the demo runs was published from.
# The plugin manifests declare `api_version = "0.103"` to match.
# kernel-release:end pin
#
# `trovato-sdk` pulls `trovato-sdk-macros` through a repo-relative path
# dependency; cargo resolves that inside the git checkout, so only this one
# entry is needed.
trovato-sdk = { git = "https://github.com/jeremyandrews/trovato.git", rev = "496b8f113be66102830723c1e2a968cad2ec1e0d" }

# trovato-kernel: TEST ONLY, and pinned to the same revision as the SDK above.
#
# The host-in-the-loop suites under plugins/*/tests/ load each compiled module
# from the assembled overlay and drive it through the real TapDispatcher,
# ItemService, plugin migration runner and HTTP router against a real Postgres.
# There is no way to do that without the kernel, and a fake host would be a fake
# answer to "does this plugin work on Trovato".
#
# Every plugin takes it as a DEV-dependency only. Dev-dependencies are never
# built for `--target wasm32-wasip1`, so the shipped modules carry none of it and
# the "builds standalone with no Trovato checkout" claim is untouched: the kernel
# arrives the same way the SDK does, as a pinned git revision.
#
# The rev must equal the SDK's. A plugin compiled against one contract and tested
# against another kernel is a test that proves nothing about what ships;
# demo/checks/src/lib.rs asserts the two pins are the same string, so moving one
# without the other fails the build.
trovato-kernel = { git = "https://github.com/jeremyandrews/trovato.git", rev = "496b8f113be66102830723c1e2a968cad2ec1e0d" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The rest of this table is test-only, for the host-in-the-loop suites. Each
# version is the one the pinned kernel itself resolves, because several of these
# types cross the kernel's API: `RequestServices::for_background` takes a
# `reqwest::Client`, the router is an `axum::Router`, the pool is a `sqlx::PgPool`.
# A second major version of any of them would not be the same type.
argon2 = "0.5"
axum = "0.8"
rcgen = "0.13"
reqwest = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "uuid"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tower-sessions = "0.14"
redis = { version = "0.27", features = ["tokio-comp"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
