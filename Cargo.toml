[workspace]
resolver = "2"
members = [
    "demo/checks",
    "plugins/ritrovo_access",
    "plugins/ritrovo_cfp",
    "plugins/ritrovo_importer",
    "plugins/ritrovo_notify",
    "plugins/ritrovo_translate",
]

[workspace.package]
version = "0.2.1-devel"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
# trovato-sdk — the Trovato plugin contract, consumed as an EXTERNAL git
# dependency from the PUBLIC Trovato repository. Ritrovo builds with no Trovato
# checkout anywhere on disk, and with no credentials: anyone can clone this
# repository and run the build. Do not reintroduce a path dependency; a path dep
# is what made this workspace unbuildable outside the monorepo it was split from.
#
# This used to point at an unpublished development repository, which meant the
# build worked only for someone who already had access to a private repo — the
# opposite of what a public reference application is for. That repository is
# archived and is not the repo of record; nothing here may reference it.
#
# PINNED BY `rev` rather than a branch, so "Ritrovo builds against the published
# contract" names a specific contract rather than whatever `main` is today.
# The current pin:
#
#   tag                 v0.102.0
#   rev                 20baa121810b5c656b3f80028335770069fab5e0
#   Trovato version     0.102.0
#   KERNEL_API_VERSION  (0, 102)
#
# The rev is the commit the v0.102.0 tag points at (`git rev-list -n 1
# v0.102.0`): the tree the ghcr.io/jeremyandrews/trovato:0.102.0 image the demo
# runs was published from (docker-publish, tag push, 2026-09-02). netgrasp-trovato
# pins the version sweep commit ca76a96 instead, six commits earlier on the same
# line. This repository pins the tag's commit so the SDK it compiles against and
# the kernel it runs on are the same tree. The plugin manifests declare
# `api_version = "0.102"` to match.
#
# BUMP PROTOCOL: move this rev only to another commit that is (a) pushed to
# origin, and (b) a deliberate contract checkpoint, preferably a release tag.
# Record the new (tag, rev, Trovato version, KERNEL_API_VERSION) here when you
# do, and move the manifests' api_version, the demo's kernel image and
# RELEASE in scripts/check-tutorial-templates.sh with it.
#
# `trovato-sdk` pulls `trovato-sdk-macros` through a repo-relative path
# dependency; cargo resolves that inside the git checkout, so only this one
# entry is needed.
trovato-sdk = { git = "https://github.com/jeremyandrews/trovato.git", rev = "20baa121810b5c656b3f80028335770069fab5e0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
