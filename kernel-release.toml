# The Trovato release this repository pins, and the only place it is authored.
#
# Everything else in the repository that names the release is DERIVED from these
# two fields, written by scripts/sync-kernel-release.sh and checked by
# demo/checks/tests/demo_wiring.rs. To move the pin:
#
#     scripts/sync-kernel-release.sh --set-version 0.103.0
#
# which resolves the tag against the real Trovato repository, rewrites this file,
# and rewrites every derived location. Then review the diff. Editing a derived
# location by hand is not wrong, it is just undone by the next sync and reported
# by `cargo test --workspace` in the meantime.
#
# The derivations, so a reader does not have to open the script:
#
#     git tag             v{version}                      v0.102.0
#     manifest api        major.minor of {version}        0.102
#     KERNEL_API_VERSION  (major, minor) of {version}     (0, 102)
#     demo kernel image   ghcr.io/jeremyandrews/trovato:{version}
#     SDK and kernel rev  {rev}, verbatim
#
# `rev` is the commit the `v{version}` tag points at, which is the tree the
# published container image of that release was built from.
#
# A NIGHTLY PIN adds a third field, `image`, and names a commit on Trovato's
# `main` instead of a release:
#
#     scripts/sync-kernel-release.sh --set-nightly 81290cc     (or `main`)
#
# reads the commit out of the build provenance of the multi-arch
# `ghcr.io/jeremyandrews/trovato:nightly-<sha>` image the kernel publishes for
# every `main` commit, and refuses unless every platform names that commit.
# `version` is then the kernel's workspace version at the commit (what
# `KERNEL_API_VERSION` is read from), the demo image is `trovato:{image}`, and
# the tutorial templates are diffed against the commit, since there is no tag.
# `--set-version` goes back to a release and drops `image`. The dependency in
# Cargo.toml has to carry the literal sha: cargo cannot read a git dependency's
# `rev` out of another file, which is why this is a generator plus a test rather
# than a variable.
#
# WHAT THIS DOES NOT OWN. The generator owns the places where naming the wrong
# release BREAKS something: the two revs, the five manifests, the demo image, the
# template checker's tag, and the marker blocks in README.md and docs/INSTALL.md.
# Other files name the release in prose that is dated or narrative, and a bump
# does not silently falsify them the way a stale manifest breaks an install. They
# are left to their authors on purpose. `grep -rn 0\.10 --exclude-dir=.git` finds
# every mention if you want to sweep them by hand.

version = "0.107.0"
rev = "81290cc862b2c8302bc0a99d270f2571405c51ef"
image = "nightly-81290cc"
