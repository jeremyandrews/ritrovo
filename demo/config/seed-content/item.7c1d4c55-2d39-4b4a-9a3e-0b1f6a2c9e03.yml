      ## confs.tech
      
      Most of the conferences on Ritrovo come from **[confs.tech](https://confs.tech)**,
      an open, community-maintained list of developer conferences, published as JSON at
      [github.com/tech-conferences/conference-data](https://github.com/tech-conferences/conference-data).
      Thank you to everyone who maintains it.
      
      Ritrovo's importer fetches the current and next year's files for each topic once
      a day, maps confs.tech's topics onto Ritrovo's own topic tree, and queues what
      changed. New conferences land on the Incoming stage and are reviewed by an
      editor before they are published, so a conference can be in confs.tech and not
      yet here. Corrections belong upstream: fix the entry in confs.tech and the next
      import carries the fix.
      
      ## Member submissions
      
      Signed-in members can [submit a conference](/conferences/submit). Submissions
      are reviewed the same way imports are.
      
      ## Seed content
      
      Descriptions, speakers and the Italian translations of a handful of featured
      conferences are demonstration content written for this site, not imported.
