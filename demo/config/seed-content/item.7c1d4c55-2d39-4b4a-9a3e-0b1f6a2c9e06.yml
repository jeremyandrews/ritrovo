    value: |
      Ritrovo lists developer conferences, from the
      [confs.tech](https://confs.tech) open dataset and from people who run them:
      when and where they are, what they are about, and whether the call for
      papers is still open. Browse by topic, find the CFPs closing this fortnight,
      or search by name, city or speaker.
