#
# A kernel `page` item rather than text in a template, because the kernel renders
# a front page inline only when it is an item; anything else is a redirect. Being
# an item also makes it content: an editor changes the welcome at
# /item/7c1d4c55-2d39-4b4a-9a3e-0b1f6a2c9e06/edit, and the Italian at /it/ is its
# translation (demo/config/seed-italian/item_translation.7c1d4c55-2d39-4b4a-9a3e-0b1f6a2c9e06.it.yml), overlaid by
# the kernel. Ritrovo's page--front.html puts the tiles under it.
