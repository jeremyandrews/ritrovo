    value: |
      Ritrovo is run as an open-source project, so the best way to reach the people
      behind it is in the open.
      
      - **A conference is missing or wrong.** If it came from confs.tech, correct it
        there and the next daily import picks the change up: open an issue or pull
        request at [github.com/tech-conferences/conference-data](https://github.com/tech-conferences/conference-data).
        Otherwise, sign in and [submit it](/conferences/submit); an editor reviews
        every submission before it goes live.
      - **Something on the site is broken.** Open an issue at
        [github.com/jeremyandrews/ritrovo/issues](https://github.com/jeremyandrews/ritrovo/issues).
      - **A question about the platform underneath.** Trovato's issues are at
        [github.com/jeremyandrews/trovato/issues](https://github.com/jeremyandrews/trovato/issues).
      
      There is no contact form on this demo: it would need to send mail, and this
      site is configured to send none.
