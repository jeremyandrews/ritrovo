      Ritrovo is a directory of developer conferences: what is on, where, when, and
      whether its call for papers is still open. It is also a reference application.
      Every page you are reading is served by [Trovato](https://github.com/jeremyandrews/trovato),
      a content platform written in Rust, with Ritrovo's plugins, templates and
      configuration laid over a stock release.
      
      ## What is here
      
      - **[Conferences](/conferences)**: upcoming events, filterable by topic, country and language.
      - **[Calls for papers](/cfps)**: conferences still accepting talk proposals, closest deadline first.
      - **[Topics](/topics)**: a three-level tree, from Languages down to Kotlin.
      - **[Speakers](/speakers)**: people speaking at the conferences listed here.
      - **[Search](/search)**: everything above, by keyword.
      
      ## Where the data comes from
      
      Most conferences are imported every day from the open
      [confs.tech](https://confs.tech) dataset; the rest are submitted by members and
      reviewed by editors before they appear. See [Data sources](/data-sources).
      
      ## How it is built
      
      The source, including the record of every place the platform could not yet do
      what the design asked of it, is at
      [github.com/jeremyandrews/ritrovo](https://github.com/jeremyandrews/ritrovo).
