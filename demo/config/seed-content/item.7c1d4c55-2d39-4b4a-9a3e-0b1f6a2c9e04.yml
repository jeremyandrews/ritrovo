      Ritrovo is a demonstration site. This is what it keeps, and why.
      
      ## If you only browse
      
      Nothing is stored about you. There are no analytics, no advertising and no
      third-party scripts. The server keeps ordinary request logs for operating the
      site.
      
      ## If you create an account
      
      Ritrovo stores your username, email address, password (hashed, never in
      readable form), time zone, and anything you choose to add: a bio, comments,
      conference submissions and the conferences you follow. A session cookie keeps
      you signed in; it is the only cookie the site sets.
      
      Your email address is not shown to other members and is not used to send you
      anything: this site sends no mail.
      
      ## Your data
      
      You can export what the site holds about you, or delete your account, from your
      profile. Deleting an account removes its personal data.
      
      ## Search
      
      Search runs in your browser against a static index of published conferences
      and speakers. What you type is not sent to the server unless you submit the
      search form without JavaScript.
