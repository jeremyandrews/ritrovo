# Editor role — reviews what the importer lands, held by editor_alice.
#
# The brief's editor sees the Incoming and Curated stages, edits any
# conference, sees the editor_notes field, and promotes Incoming to Curated.
# They do not publish: that is the publisher's job.
#
# `config import` applies these permissions with REPLACE semantics: the file is
# authoritative, so removing a line here revokes that permission on the next
# import.
#
# THREE OF THE BRIEF'S PERMISSIONS ARE NOT HERE AND CANNOT BE:
#   - view incoming conferences   (declared by ritrovo_access)
#   - view curated conferences    (declared by ritrovo_access)
#   - edit conferences            (declared by ritrovo_access)
# `tap_perm` is not dispatched at the pinned release, so no role can hold a
# plugin's permission. `FRICTION.md`, `G-PERM-TAP-NOT-DISPATCHED`.
#
# WHAT STANDS IN FOR THEM: `edit any content`, a kernel permission, is this
# role's editorial signal. `ritrovo_access` treats it as equivalent to
# `edit conferences` when it decides stage access, and the editorial screen at
# /admin/content/editorial is gated on it. That is a deliberate, documented
# substitution, not an accident, and it is coarser than the brief asks for:
# `edit any content` is site-wide, so an editor can edit any item type, not
# only a conference. The moment the kernel dispatches `tap_perm`, the four
# permissions above can be listed here and the substitution can be dropped;
# `ritrovo_access` already declares them and already prefers them when present.
#
# THE MODERATION QUEUE IS THIS ROLE'S, AS OF 0.103.0.
#
# `administer comments` opens `/admin/content/comments`, and this is the change
# that makes an editor an editor of comments rather than only of conferences.
# At 0.102 that screen called `require_admin`, which reads the `users.is_admin`
# column and nothing else, so no grant could reach it and the row stayed
# blocked (`FRICTION.md`, `G-ADMIN-SCREENS-ARE-ADMIN-ONLY`). At 0.103.0 the six
# comment routes call `require_permission(..., "administer comments")` instead
# (`crates/kernel/src/routes/admin.rs`), so the permission is the gate.
#
# `access administration pages` is the other half and it is not optional.
# 0.103.0 moved `/admin` itself off `administer site` onto this new, deliberately
# weak permission: admission to the administration section and no authority
# inside it, with every screen still asking for its own. Without it an editor
# reaches the moderation queue only by typing the address and gets 403 on the
# dashboard that would have linked there.
#
# What an editor still cannot open is `/admin/content` itself, the content list
# and its bulk actions: those remain on `require_admin`. So the sidebar an
# editor sees lists screens that answer 403, which is the kernel's own
# BL-117 (the admin layout does not filter its sidebar to what the viewer may
# open). `G-ADMIN-SCREENS-ARE-ADMIN-ONLY` is narrowed rather than closed.
#
# `edit any comments` is NOT here: `ritrovo_access` declares it and nothing in
# the kernel checks it, so it would be a grant with nothing behind it.
id: 0193a5a0-0002-7000-8000-000000000002
name: editor
created: "2026-01-01T00:00:00Z"
permissions:
- access administration pages
- access content
- administer comments
- create content
- edit own content
- edit any content
- access files
- use filtered_html
- view own profile
