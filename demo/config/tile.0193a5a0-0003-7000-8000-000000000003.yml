# Topic Cloud (machine_name: topic_cloud), sidebar.
#
# Every topic with an upcoming Live conference, sized by how many, rewritten by
# ritrovo_importer's cron. Counting is something no gather can do, so this one
# is plugin code by necessity, not only because the tile type renders nothing.
#
# Shown on the front page and the listings a visitor browses by topic, and not
# on a conference or a static page, where it would only push the content down.
id: 0193a5a0-0003-7000-8000-000000000003
machine_name: topic_cloud
label: Topic Cloud
region: sidebar
tile_type: custom_html
config:
  body: |
    <p class="tile-list__empty">Filled in by ritrovo_importer on its next cron call.</p>
  format: full_html
visibility:
  paths:
  - /
  - /conferences
  - /topics*
weight: 10
status: 1
plugin: core
