# Front page: the "Find your next conference" page item, rendered inline.
#
# The kernel renders a front page in place only when site_front_page names an
# item, as /item/{uuid}; any other path, an alias included, is answered with a
# 307 to it (crates/kernel/src/routes/front.rs). Until A9 this was /conferences
# and `/` was that redirect. It is now an item so that `/` and `/it/` render
# Ritrovo's page--front.html: the item's body as the introduction, the upcoming
# conferences and the sidebar tiles under it.
#
# The item is seed content (demo/config/seed-content/item.7c1d4c55-…-e06.yml),
# imported after this set. The kernel resolves the item on each request, so the
# order does not matter, and until the seed lands `/` shows the kernel's
# promoted listing rather than an error.
#
# A `variable` config entity writes straight to the site_config table, which is
# the same row the admin form at /admin/config/site writes, so importing it is
# the non-interactive equivalent of filling that form in.
key: site_front_page
value: /item/7c1d4c55-2d39-4b4a-9a3e-0b1f6a2c9e06
