title: "Trova la tua prossima conferenza"
fields:
  body:
    format: markdown
    value: |
      Ritrovo raccoglie le conferenze per sviluppatori, dal dataset aperto di
      [confs.tech](https://confs.tech) e da chi le organizza: quando e dove si
      tengono, di cosa parlano e se la call for papers è ancora aperta. Sfoglia
      per argomento, trova le CFP che chiudono nelle prossime due settimane, o
      cerca per nome, città o relatore.
