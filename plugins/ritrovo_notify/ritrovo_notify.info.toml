name = "ritrovo_notify"
description = "Subscription and notification system for conferences"
version = "1.1.0"
api_version = "0.102"
default_enabled = false
dependencies = []

[taps]
# None yet. See README.md for what this plugin will implement, and src/lib.rs for
# why the menu entry, the Subscribe button, the queue and the permissions it used
# to declare were removed.
implements = []
weight = 0

[migrations]
files = [
    "migrations/001_create_pending_notifications.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The Trovato
# kernel builds this plugin's WASM linker from host_interfaces: it receives
# exactly the host interfaces named here (plus baseline WASI), and rejects the
# plugin at load time if the module imports one not declared.
#
# Derived from the compiled .wasm import section, never from reading the source.
# While this plugin implemented taps it imported `trovato:kernel/logging`, which
# the SDK's tap entry-point macro pulls in whatever the tap bodies do. With no
# taps there is no macro-generated code and the module imports no kernel
# interface at all, so the list is empty; the host-in-the-loop suite loads the
# module, which is the check.
[capabilities]
host_interfaces = []
