name = "ritrovo_notify"
description = "Subscription and notification system for conferences"
version = "1.0.0"
api_version = "0.2"
default_enabled = false
dependencies = []

[taps]
implements = [
    "tap_menu",
    "tap_perm",
    "tap_item_view",
    "tap_queue_info",
]
weight = 0

[migrations]
files = [
    "migrations/001_create_pending_notifications.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The Trovato
# kernel builds this plugin's WASM linker from host_interfaces — it receives
# exactly the host interfaces named here (plus baseline WASI). Derived from
# the source (lib.rs implements only data-returning taps; no host calls — 
# the ritrovo workspace is not buildable in this checkout to compile-verify).
[capabilities]
host_interfaces = []
