[package]
name = "ritrovo_translate"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Language detection and translation workflow for Ritrovo conferences"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
trovato-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The host-in-the-loop suite in tests/ only. None of this is built for
# wasm32-wasip1 (dev-dependencies never are), so the shipped module carries none
# of it. The shared harness those tests include is tests/host/mod.rs at the
# repository root.
[dev-dependencies]
trovato-kernel = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true }
tower-sessions = { workspace = true }
redis = { workspace = true }
uuid = { workspace = true }
