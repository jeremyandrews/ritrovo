name = "ritrovo_translate"
description = "Language detection and translation workflow for conferences"
version = "1.0.0"
api_version = "0.2"
default_enabled = false
dependencies = ["trovato_content_translation"]

[taps]
implements = [
    "tap_item_view",
    "tap_item_insert",
]
weight = 0

# Declared plugin capabilities (WASM-1, deny-unless-declared). The Trovato
# kernel builds this plugin's WASM linker from host_interfaces — it receives
# exactly the host interfaces named here (plus baseline WASI). Derived from
# the compiled .wasm import section.
[capabilities]
host_interfaces = ["logging"]
