name = "ritrovo_importer"
description = "Import tech conferences from confs.tech into Trovato"
version = "1.1.0"
api_version = "1.0"
default_enabled = false
dependencies = []

[taps]
implements = [
    "tap_install",
    "tap_perm",
    "tap_menu",
    "tap_cron",
    "tap_queue_info",
    "tap_queue_worker",
]
weight = 0

[migrations]
files = [
    "migrations/001_create_ritrovo_state.sql",
    "migrations/002_dedup_conferences.sql",
    "migrations/003_remove_conferences_alias.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The Trovato
# kernel builds this plugin's WASM linker from host_interfaces — it receives
# exactly the host interfaces named here (plus baseline WASI). Derived from
# the compiled .wasm import section.
[capabilities]
host_interfaces = ["db", "http", "logging", "queue"]
# Uses the raw-SQL host functions (query-raw/execute-raw). WASM-2 field
# (declared now, enforced later); inert under WASM-1.
raw_sql = true
