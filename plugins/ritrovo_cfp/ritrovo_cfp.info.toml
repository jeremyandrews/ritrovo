name = "ritrovo_cfp"
description = "CFP deadline badge, validation and the conference assistant for conferences"
version = "1.2.0"
api_version = "0.107"
default_enabled = false
dependencies = []

[taps]
implements = [
    "tap_item_view",
    # Checks that a CFP does not close after its conference ends. It can only
    # report: the kernel reads a `fields` object back from this tap, merges it
    # and saves regardless, so no tap can refuse a write
    # (FRICTION.md, G-PRESAVE-CANNOT-REFUSE). The rule is enforced where
    # something is allowed to say no, which is the submission form
    # `ritrovo_forms` serves.
    "tap_item_presave",
    # The conference assistant (STATUS 31.8): one item scope on `conference`
    # for editors, two read tools and one write tool that only proposes.
    # src/assistant.rs.
    "tap_assistant_scopes",
    "tap_assistant_context",
    "tap_assistant_tool",
]
weight = 0

# Declared plugin capabilities (WASM-1, deny-unless-declared). The Trovato
# kernel builds this plugin's WASM linker from host_interfaces — it receives
# exactly the host interfaces named here (plus baseline WASI). Derived from
# the compiled .wasm import section.
#
# `db` and `raw_sql` are for one query, the database clock the countdown is
# measured against: the kernel links no WASI clock into a plugin, so this is the
# only clock a plugin can reach, and it is the one ritrovo_importer already uses.
# The badge used to count from the item's `changed` timestamp instead, and so
# reported the day the record was last saved rather than today.
[capabilities]
#
# The assistant adds three. `query` is the gather pipeline its two read tools
# run, as the editor and on Live. `item-api` loads the conference for the
# snapshot and saves the corrected CFP date once an editor applies it, through
# the kernel's item service. `user-api` is the permission check every tool
# makes again at the moment of the call.
host_interfaces = ["db", "logging", "query", "item-api", "user-api"]
# Uses the raw-SQL host function query-raw, for SELECT NOW() and nothing else.
raw_sql = true
